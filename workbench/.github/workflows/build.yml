name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install Node dependencies
        working-directory: workbench
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies (macOS)
        if: matrix.platform == 'mac'
        working-directory: ai-service
        run: pip3 install -r requirements.txt

      - name: Install Python dependencies (Windows)
        if: matrix.platform == 'win'
        working-directory: ai-service
        run: pip install -r requirements.txt

      # v0.16 CI-2 (req-063): 先 build renderer+main 产物，再扫泄露，最后 dist。
      # 设计顺序：dist 是 electron-builder 打包（5-10 分钟），先用便宜的 build+scan
      # 卡住「OSS 零个人信息泄露」原则破坏，节约 CI 时长。
      - name: Build renderer + main artifacts
        working-directory: workbench
        run: pnpm build

      - name: Verify no personal paths in build artifacts
        working-directory: workbench
        run: node scripts/scan-personal-paths.mjs

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        working-directory: workbench
        run: pnpm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (Windows)
        if: matrix.platform == 'win'
        working-directory: workbench
        run: pnpm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workbench/release/*.dmg
            workbench/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
