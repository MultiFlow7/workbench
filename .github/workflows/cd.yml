name: CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile
        working-directory: workbench

      - name: Install Python dependencies (macOS)
        if: matrix.platform == 'mac'
        run: pip3 install -r requirements.txt
        working-directory: ai-service

      - name: Install Python dependencies (Windows)
        if: matrix.platform == 'win'
        run: pip install -r requirements.txt
        working-directory: ai-service

      - name: Build renderer + main artifacts
        run: pnpm build
        working-directory: workbench

      - name: Verify no personal paths in build artifacts
        run: node scripts/scan-personal-paths.mjs
        working-directory: workbench

      - name: Build (macOS)
        if: matrix.platform == 'mac'
        run: pnpm run dist:mac
        working-directory: workbench
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (Windows)
        if: matrix.platform == 'win'
        run: pnpm run dist:win
        working-directory: workbench
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            workbench/release/*.dmg
            workbench/release/*.exe
            workbench/release/*.AppImage
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
